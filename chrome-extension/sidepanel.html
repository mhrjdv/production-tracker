<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laserman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./sidepanel.css" />
</head>
<body>
  <div class="sp-app" id="app">

    <!-- ─── Header ────────────────────────────────────── -->
    <header class="sp-header">
      <div class="sp-brand">
        <svg class="sp-brand-icon" width="16" height="16" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="16" height="16" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
          <path d="M6 6l3 3-3 3M10 12h3" stroke="#e5e5e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sp-brand-name">Laserman</span>
      </div>
      <div class="sp-header-right">
        <button type="button" class="sp-icon-btn sp-queue-toggle" id="queueToggle" title="Sync Queue">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M3 4h10M3 8h7M3 12h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="sp-queue-dot hidden" id="queueDot"></span>
        </button>
        <button type="button" class="sp-icon-btn" id="settingsToggle" aria-label="Settings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
            <path d="M7.5 2L7.1 3.8a5 5 0 0 0-1.3.7L4 4l-1.5 2.6 1.8 1.5a5 5 0 0 0 0 1.4L2.5 11l1.5 2.6 1.8-.5a5 5 0 0 0 1.3.7L7.5 16h3l.4-2.2a5 5 0 0 0 1.3-.7l1.8.5L15.5 11l-1.8-1.5a5 5 0 0 0 0-1.4L15.5 6.6 14 4l-1.8.5a5 5 0 0 0-1.3-.7L10.5 2h-3Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
            <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Settings overlay ──────────────────────────── -->
    <section class="sp-overlay hidden" id="settingsPanel">
      <div class="sp-overlay-header">
        <span>Settings</span>
        <button type="button" class="sp-icon-btn" id="settingsClose" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <label class="sp-settings-field">
        <span>App URL</span>
        <input id="cfgBaseUrl" type="url" placeholder="http://localhost:3000" />
      </label>
      <label class="sp-settings-field">
        <span>API Token</span>
        <input id="cfgToken" type="password" placeholder="lmt_..." />
      </label>
      <label class="sp-settings-field">
        <span>AI Base URL</span>
        <input id="cfgOpenAiBaseUrl" type="url" placeholder="https://api.openai.com/v1" />
      </label>
      <label class="sp-settings-field">
        <span>AI Model</span>
        <input id="cfgOpenAiModel" type="text" placeholder="gpt-4.1-mini" />
      </label>
      <label class="sp-settings-field">
        <span>BYOK API Key</span>
        <input id="cfgOpenAiApiKey" type="password" placeholder="sk-..." />
      </label>
      <div class="sp-settings-actions">
        <button type="button" class="sp-btn sp-btn-primary" id="cfgSave">Save</button>
        <button type="button" class="sp-btn sp-btn-ghost" id="cfgReload">Reload</button>
      </div>
    </section>

    <!-- ─── Auth gate ─────────────────────────────────── -->
    <div class="sp-auth-gate hidden" id="authGate">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <rect x="8" y="18" width="24" height="16" rx="4" stroke="#5a6578" stroke-width="1.5"/>
        <path d="M14 18v-4a6 6 0 0 1 12 0v4" stroke="#5a6578" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="26" r="2" fill="#5a6578"/>
      </svg>
      <p class="sp-auth-msg">Connect to Laserman</p>
      <div class="sp-auth-form">
        <label class="sp-auth-field">
          <span>App URL</span>
          <input id="authBaseUrl" type="url" placeholder="http://localhost:3000" />
        </label>
        <label class="sp-auth-field">
          <span>API Token</span>
          <input id="authToken" type="password" placeholder="lmt_..." />
        </label>
        <details class="sp-auth-more">
          <summary>AI Settings (optional)</summary>
          <div class="sp-auth-more-grid">
            <label class="sp-auth-field">
              <span>AI Base URL</span>
              <input id="authOpenAiBaseUrl" type="url" placeholder="https://openrouter.ai/api/v1" />
            </label>
            <label class="sp-auth-field">
              <span>AI Model</span>
              <input id="authOpenAiModel" type="text" placeholder="gpt-4.1-mini" />
            </label>
            <label class="sp-auth-field">
              <span>BYOK API Key</span>
              <input id="authOpenAiApiKey" type="password" placeholder="sk-..." />
            </label>
          </div>
        </details>
        <button type="button" class="sp-btn sp-btn-primary sp-auth-connect" id="authConnect">Connect</button>
      </div>
    </div>

    <!-- Hidden tab nav (DOM compat — modeNav referenced by JS) -->
    <nav class="hidden" id="modeNav" aria-label="Extension modes">
      <button type="button" class="sp-tab active" data-mode="capture">Capture</button>
      <button type="button" class="sp-tab" data-mode="reuse">History</button>
      <button type="button" class="sp-tab" data-mode="queue">Queue</button>
    </nav>

    <!-- ─── MAIN: single scrollable view ──────────────── -->
    <section class="sp-main" data-panel="capture" id="panelCapture">

      <!-- Context selectors (sticky) -->
      <div class="sp-ctx-bar">
        <div class="sp-ctx-field">
          <label for="ctxProjectSelect">Project</label>
          <select id="ctxProjectSelect"></select>
        </div>
        <div class="sp-ctx-field">
          <label for="ctxSceneSelect">Scene</label>
          <input id="ctxSceneSearch" type="text" class="sp-ctx-search" placeholder="Filter..." />
          <select id="ctxSceneSelect"></select>
        </div>
        <div class="sp-ctx-field">
          <label for="ctxShotSelect">Shot</label>
          <select id="ctxShotSelect">
            <option value="">(Scene-level)</option>
          </select>
        </div>
      </div>

      <!-- Detection strip -->
      <div class="sp-detect" id="ctxDetectionBanner">
        <div class="sp-detect-info">
          <span class="sp-detect-dot" id="ctxDetectDot"></span>
          <span class="sp-detect-label" id="ctxDetectedPlatform">No platform detected</span>
          <span class="sp-detect-type" id="ctxDetectedType"></span>
        </div>
        <div class="sp-detect-actions">
          <button type="button" class="sp-detect-btn" id="capAutoFill">Fill</button>
          <button type="button" class="sp-detect-btn-icon" id="capPickThread" title="Pick from thread">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 3h8v6H6l-3 2V3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="sp-detect-btn-icon" id="capAiAssist" title="AI assist">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v2M7 11v2M1 7h2M11 7h2M3 3l1.4 1.4M9.6 9.6L11 11M11 3l-1.4 1.4M4.4 9.6L3 11" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="sp-detect-btn-icon" id="ctxRefreshDetect" title="Refresh detection">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <path d="M11.5 7a4.5 4.5 0 1 1-1.2-3.1M11.5 2v2h-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Candidate picker overlay -->
      <div class="sp-candidate-picker hidden" id="candidatePicker">
        <div class="sp-candidate-picker-header">
          <span>Thread Candidates</span>
          <button type="button" class="sp-icon-btn" id="candidatePickerClose" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sp-candidate-list" id="candidateList"></div>
      </div>

      <!-- Hidden compat elements -->
      <div id="ctxShotCard" class="hidden"></div>
      <div id="ctxIntentBox" class="hidden"><p id="ctxIntentText"></p><div id="ctxIntentActions"></div></div>
      <span id="capContextLabel" class="hidden"></span>
      <div id="capContextBar" class="hidden"></div>

      <!-- ─── Capture form ────────────────────────────── -->

      <!-- Platform -->
      <div class="sp-field">
        <div class="sp-field-top">
          <label for="capPlatformSelect">Platform</label>
        </div>
        <input id="capPlatformSearch" type="text" class="sp-ctx-search" placeholder="Filter platforms..." />
        <select id="capPlatformSelect"></select>
      </div>

      <!-- Prompt -->
      <div class="sp-field">
        <div class="sp-field-top">
          <label for="capPrompt">Prompt</label>
          <div class="sp-field-btns">
            <button type="button" class="sp-mini-action" id="capApplyPrompt" title="Apply prompt to page">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 10L10 2M10 2H4M10 2v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Apply
            </button>
            <button type="button" class="sp-mini-action" id="capRefinePrompt" title="AI refine prompt">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.5 2.5l1.4 1.4M8.1 8.1l1.4 1.4M9.5 2.5L8.1 3.9M3.9 8.1L2.5 9.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
              Refine
            </button>
            <button type="button" class="sp-clear" data-clear="capPrompt" title="Clear">&times;</button>
          </div>
        </div>
        <textarea id="capPrompt" rows="4" placeholder="Auto-filled from page or type your prompt..."></textarea>
      </div>

      <!-- Output URL -->
      <div class="sp-field">
        <div class="sp-field-top">
          <label for="capOutputUrl">Output URL</label>
          <button type="button" class="sp-clear" data-clear="capOutputUrl" title="Clear">&times;</button>
        </div>
        <input id="capOutputUrl" type="url" placeholder="Generated asset URL (auto-detected)" />
      </div>

      <!-- Type + Status compact row -->
      <div class="sp-compact-row">
        <div class="sp-compact-field">
          <label for="capAssetType">Type</label>
          <select id="capAssetType">
            <option value="IMAGE">Image</option>
            <option value="VIDEO">Video</option>
            <option value="AUDIO">Audio</option>
            <option value="MUSIC">Music</option>
            <option value="VOICE">Voice</option>
            <option value="NARRATION">Narration</option>
            <option value="STORYBOARD">Storyboard</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="sp-compact-field">
          <label for="capAssetStatus">Status</label>
          <select id="capAssetStatus">
            <option value="DRAFT">Draft</option>
            <option value="GENERATED">Generated</option>
            <option value="SELECTED">Selected</option>
          </select>
        </div>
      </div>

      <!-- Advanced fields -->
      <details class="sp-more" id="capMoreFields">
        <summary>More fields</summary>
        <div class="sp-more-grid">
          <div class="sp-field">
            <div class="sp-field-top">
              <label for="capTitle">Title</label>
              <button type="button" class="sp-clear" data-clear="capTitle" title="Clear">&times;</button>
            </div>
            <input id="capTitle" type="text" placeholder="Shot name / variant" />
          </div>

          <div class="sp-field">
            <div class="sp-field-top">
              <label for="capNegPrompt">Negative Prompt</label>
              <button type="button" class="sp-clear" data-clear="capNegPrompt" title="Clear">&times;</button>
            </div>
            <textarea id="capNegPrompt" rows="2" placeholder="Things to avoid..."></textarea>
          </div>

          <div class="sp-field-row">
            <div class="sp-field">
              <label for="capModelName">Model</label>
              <input id="capModelName" type="text" placeholder="Veo-3" />
            </div>
            <div class="sp-field">
              <label for="capExternalId">External ID</label>
              <input id="capExternalId" type="text" placeholder="job_abc" />
            </div>
          </div>

          <div class="sp-field">
            <div class="sp-field-top">
              <label for="capSourceUrl">Source URL</label>
              <button type="button" class="sp-clear" data-clear="capSourceUrl" title="Clear">&times;</button>
            </div>
            <input id="capSourceUrl" type="url" placeholder="Page URL (auto-filled)" />
          </div>

          <div class="sp-field">
            <div class="sp-field-top">
              <label for="capThumbUrl">Thumbnail URL</label>
              <button type="button" class="sp-clear" data-clear="capThumbUrl" title="Clear">&times;</button>
            </div>
            <input id="capThumbUrl" type="url" placeholder="Preview image" />
          </div>

          <div class="sp-field">
            <div class="sp-field-top">
              <label for="capTags">Tags</label>
              <button type="button" class="sp-clear" data-clear="capTags" title="Clear">&times;</button>
            </div>
            <input id="capTags" type="text" placeholder="hero, approved, pass-2" />
          </div>

          <div class="sp-field">
            <label for="capMetadata">Metadata JSON</label>
            <textarea id="capMetadata" rows="2" placeholder='{"seed": 42}'></textarea>
          </div>

          <div class="sp-field">
            <label for="capNotes">Notes</label>
            <textarea id="capNotes" rows="2" placeholder="Optional notes..."></textarea>
          </div>
        </div>
      </details>

      <!-- Actions -->
      <div class="sp-actions">
        <button type="button" class="sp-btn sp-btn-ghost" id="capClearAll">Clear</button>
        <button type="button" class="sp-btn sp-btn-primary sp-btn-save" id="capSave">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7l3.5 3.5L12 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Save
        </button>
      </div>

      <!-- ─── Versions section (was History tab) ──────── -->
      <div class="sp-section-divider">
        <span class="sp-section-title">Versions</span>
        <span class="sp-versions-count" id="versionsCount">0</span>
        <div class="sp-section-right">
          <button type="button" class="sp-mini-link" id="reuseRestoreDraft">Draft</button>
          <button type="button" class="sp-mini-link" id="reuseClearDraft">Clear draft</button>
        </div>
      </div>

      <!-- Version filters -->
      <div class="sp-version-filters">
        <input id="reuseSearch" type="text" class="sp-version-search" placeholder="Search..." />
        <div class="sp-filter-chips" id="reuseFilterChips">
          <button type="button" class="sp-chip active" data-filter="ALL">All</button>
          <button type="button" class="sp-chip" data-filter="IMAGE">Img</button>
          <button type="button" class="sp-chip" data-filter="VIDEO">Vid</button>
          <button type="button" class="sp-chip" data-filter="AUDIO">Aud</button>
        </div>
      </div>

      <!-- Version strip (horizontal scroll) -->
      <div class="sp-version-strip" id="reuseAssetList">
        <div class="sp-empty-sm">No versions yet. Capture something first.</div>
      </div>

      <!-- Compare bar (visible when items checked) -->
      <div class="sp-compare-bar hidden" id="compareBar">
        <button type="button" class="sp-btn sp-btn-ghost sp-btn-sm" id="compareBtn">
          Compare (<span id="compareCount">0</span>)
        </button>
        <button type="button" class="sp-btn sp-btn-ghost sp-btn-sm" id="compareClear">Clear</button>
      </div>

      <!-- ─── Characters section ──────────────────────── -->
      <div class="sp-section-divider">
        <span class="sp-section-title">Characters</span>
      </div>
      <div id="ctxCharactersList" class="sp-characters-grid"></div>

    </section>

    <!-- Hidden reuse panel (DOM compat) -->
    <section class="hidden" data-panel="reuse" id="panelReuse"></section>

    <!-- ─── Queue overlay ─────────────────────────────── -->
    <section class="sp-queue-overlay hidden" data-panel="queue" id="panelQueue">
      <div class="sp-queue-header">
        <span class="sp-queue-title">Sync Queue</span>
        <span class="sp-queue-badge" id="queueCount">0</span>
        <span class="sp-queue-label">pending</span>
        <button type="button" class="sp-icon-btn sp-queue-close" id="queueClose" aria-label="Close queue">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sp-filter-chips" id="queueFilterChips">
        <button type="button" class="sp-chip active" data-filter="ALL">All</button>
        <button type="button" class="sp-chip" data-filter="IMAGE">Img</button>
        <button type="button" class="sp-chip" data-filter="VIDEO">Vid</button>
        <button type="button" class="sp-chip" data-filter="AUDIO">Aud</button>
      </div>
      <div class="sp-queue-list" id="queueList">
        <div class="sp-empty-sm">Queue is empty. All synced.</div>
      </div>
      <div class="sp-queue-actions">
        <button type="button" class="sp-btn sp-btn-primary sp-btn-sm" id="queueSyncNow">Sync Now</button>
        <button type="button" class="sp-btn sp-btn-ghost sp-btn-sm" id="queueClearFailed">Clear Failed</button>
      </div>
      <div class="sp-divider"></div>
      <p class="sp-section-label">Recent</p>
      <div class="sp-preview-list" id="queuePreviewList">
        <div class="sp-empty-sm">No synced versions yet.</div>
      </div>
    </section>

    <!-- ─── Compare overlay ───────────────────────────── -->
    <div class="sp-compare-overlay hidden" id="compareOverlay">
      <div class="sp-compare-header">
        <span class="sp-compare-title">Compare Versions</span>
        <button type="button" class="sp-icon-btn" id="compareClose" aria-label="Close compare">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sp-compare-grid" id="compareGrid"></div>
    </div>

    <!-- ─── Status bar ────────────────────────────────── -->
    <footer class="sp-status">
      <span class="sp-status-dot" id="statusDot"></span>
      <span id="statusText">Initializing...</span>
    </footer>
  </div>

  <script src="./dist/sidepanel.js"></script>
</body>
</html>
