<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Tracker Sync</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Production Tracker Sync</h1>
      <p>Capture once, version everywhere.</p>
    </header>

    <nav class="tabs" id="tabNav" aria-label="Popup sections">
      <button type="button" class="tab-btn active" data-tab="capture">Capture</button>
      <button type="button" class="tab-btn" data-tab="reuse">Reuse</button>
      <button type="button" class="tab-btn" data-tab="sync">Sync</button>
      <button type="button" class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <section class="card tab-panel" data-tab-panel="capture">
      <h2>Capture</h2>
      <label class="field">
        <span>Project</span>
        <select id="projectSelect"></select>
      </label>
      <label class="field">
        <span>Scene</span>
        <select id="sceneSelect"></select>
      </label>
      <div class="row">
        <label class="field grow">
          <span>Platform</span>
          <select id="platformSelect"></select>
        </label>
        <label class="field grow">
          <span>Type</span>
          <select id="assetType">
            <option value="IMAGE">IMAGE</option>
            <option value="VIDEO">VIDEO</option>
            <option value="SCRIPT">SCRIPT</option>
            <option value="AUDIO">AUDIO</option>
            <option value="MUSIC">MUSIC</option>
            <option value="VOICE">VOICE</option>
            <option value="NARRATION">NARRATION</option>
            <option value="STORYBOARD">STORYBOARD</option>
            <option value="OTHER">OTHER</option>
          </select>
        </label>
        <label class="field grow">
          <span>Status</span>
          <select id="assetStatus">
            <option value="DRAFT">DRAFT</option>
            <option value="GENERATED">GENERATED</option>
            <option value="SELECTED">SELECTED</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" placeholder="Shot name / variant title" />
      </label>
      <label class="field">
        <span>Prompt</span>
        <textarea id="prompt" rows="4" placeholder="Paste prompt used on current platform..."></textarea>
      </label>
      <label class="field">
        <span>Negative Prompt</span>
        <textarea id="negativePrompt" rows="2" placeholder="Optional negative prompt"></textarea>
      </label>
      <div class="row">
        <label class="field grow">
          <span>Model</span>
          <input id="modelName" type="text" placeholder="e.g. Veo-3 / MJ-v7" />
        </label>
        <label class="field grow">
          <span>External Asset ID</span>
          <input id="externalAssetId" type="text" placeholder="job_abc123" />
        </label>
      </div>
      <label class="field">
        <span>Source URL</span>
        <input id="sourceUrl" type="url" placeholder="Current tab URL" />
      </label>
      <label class="field">
        <span>Output URL</span>
        <input id="outputUrl" type="url" placeholder="Generated asset URL (optional)" />
      </label>
      <label class="field">
        <span>Thumbnail URL</span>
        <input id="thumbnailUrl" type="url" placeholder="Preview image URL (optional)" />
      </label>
      <label class="field">
        <span>Tags (comma separated)</span>
        <input id="tags" type="text" placeholder="hero, approved, pass-2" />
      </label>
      <details class="advanced-block">
        <summary>Advanced Metadata</summary>
        <label class="field">
          <span>Metadata JSON</span>
          <textarea id="metadata" rows="3" placeholder='{"durationSec": 8, "fps": 24}'></textarea>
        </label>
        <label class="field">
          <span>Notes</span>
          <textarea id="notes" rows="2" placeholder="Optional notes"></textarea>
        </label>
      </details>
      <div class="row">
        <button id="autoFill" type="button" class="secondary">Auto Fill From Page</button>
        <button id="applyPrompt" type="button" class="secondary">Apply Prompt to Page</button>
        <button id="refinePrompt" type="button" class="secondary">AI Refine Prompt</button>
      </div>
    </section>

    <section class="card tab-panel hidden" data-tab-panel="reuse">
      <h2>Reuse</h2>
      <label class="field">
        <span>Reuse Existing Scene Version Prompt</span>
        <div class="row">
          <select id="sceneAssetSelect" class="grow"></select>
          <button id="loadAssetPrompt" type="button" class="secondary">Load</button>
        </div>
      </label>
      <div id="intentPanel" class="intent hidden" role="status" aria-live="polite">
        <p id="intentSummary" class="intent-summary"></p>
        <div id="intentActions" class="row"></div>
      </div>
      <div class="row">
        <button id="restoreDraft" type="button" class="secondary">Restore Draft</button>
        <button id="clearDraft" type="button" class="secondary">Clear Draft</button>
      </div>
    </section>

    <section class="card tab-panel hidden" data-tab-panel="sync">
      <h2>Sync</h2>
      <div class="row">
        <button id="queueSync" type="button">Queue & Sync</button>
        <button id="syncNow" type="button" class="secondary">Sync Queue</button>
      </div>
      <div class="preview-wrap">
        <div class="preview-header">
          <span>Recent Scene Results</span>
        </div>
        <div id="previewList" class="preview-list"></div>
      </div>
    </section>

    <section class="card tab-panel hidden" data-tab-panel="settings">
      <h2>Settings</h2>
      <label class="field">
        <span>App URL</span>
        <input id="baseUrl" type="url" placeholder="http://localhost:3000" />
      </label>
      <label class="field">
        <span>API Token</span>
        <input id="token" type="password" placeholder="lmt_..." />
      </label>
      <label class="field">
        <span>OpenAI-Compatible Base URL (Optional)</span>
        <input id="openAiBaseUrl" type="url" placeholder="https://api.openai.com/v1" />
      </label>
      <label class="field">
        <span>OpenAI-Compatible Model (Optional)</span>
        <input id="openAiModel" type="text" placeholder="gpt-4.1-mini / any-compatible-model" />
      </label>
      <label class="field">
        <span>BYOK API Key (Local only, never synced)</span>
        <input id="openAiApiKey" type="password" placeholder="sk-..." />
      </label>
      <div class="row">
        <button id="saveConfig" type="button">Save</button>
        <button id="refreshData" type="button" class="secondary">Reload</button>
      </div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script type="module" src="./popup.js"></script>
</body>
</html>
